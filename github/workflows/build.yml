name: Build GPT Buddy

on:
  push:
    paths:
      - 'gptbuddy-forge-1.20.1-cloud-build.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'

      - name: Extract project
        run: |
          unzip -q gptbuddy-forge-1.20.1-cloud-build.zip -d source
          test -f source/gptbuddy-forge-1.20.1/build.gradle

      - name: Build JAR
        working-directory: source/gptbuddy-forge-1.20.1
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Buddy-JAR
          path: source/gptbuddy-forge-1.20.1/build/libs/*.jar
